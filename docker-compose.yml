services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: poketag
      MINIO_ROOT_PASSWORD: poketagsecret
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 poketag poketagsecret;
      mc mb -p local/poketag-saves || true;
      exit 0;
      "

volumes:
  minio_data:
